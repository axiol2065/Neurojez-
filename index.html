<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>neurojez — Invitación P2P</title>

<style>

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#111;
    color:#fff;

    padding:40px 20px;
}

.contenedor{
    width:100%;
    max-width:620px;
    margin:0 auto;
}

.box{
    background:#1d1d1d;
    border:1px solid #333;
    border-radius:20px;

    padding:25px;

    text-align:center;

    box-sizing:border-box;
}

h1{
    margin:0 0 10px 0;
    font-size:32px;
}

h2{
    margin:0 0 15px 0;
    font-size:22px;
}

p{
    line-height:1.5;
    margin:12px 0;
}

button,
a{
    width:100%;
    display:block;

    box-sizing:border-box;

    padding:16px;

    margin-top:14px;

    border-radius:14px;

    font-size:17px;

    text-align:center;

    text-decoration:none;
}

button{
    border:0;
    background:#fff;
    color:#000;

    cursor:pointer;
}

button:disabled{
    opacity:0.7;
    cursor:default;
}

a{
    border:1px solid #555;
    background:#222;
    color:#fff;
}

#abrir{
    display:none;
}

#descargar{
    display:none;
}

#estado{
    word-break:break-word;
}

</style>
</head>


<body>

<div class="contenedor">

    <div class="box">

        <h1>♟️ neurojez</h1>

        <h2>Invitación a partida</h2>

        <p id="estado">
            Preparando la invitación…
        </p>

        <button
            id="abrir"
            type="button"
        >
            Abrir neurojez
        </button>

        <a
            id="descargar"
            href="https://github.com/axiol2065/Neurojez-"
            target="_blank"
            rel="noopener noreferrer"
        >
            Descargar neurojez
        </a>

        <noscript>
            <p>
                Esta página necesita JavaScript para abrir
                automáticamente la invitación.
            </p>
        </noscript>

    </div>

</div>


<script>

(function(){

    "use strict";


    /*
     * ========================================================
     * ELEMENTOS
     * ========================================================
     */

    var estado =
        document.getElementById("estado");

    var abrir =
        document.getElementById("abrir");

    var descargar =
        document.getElementById("descargar");


    /*
     * ========================================================
     * PARÁMETROS DE LA INVITACIÓN
     * ========================================================
     */

    var parametros =
        new URLSearchParams(
            window.location.search
        );


    /*
     * ========================================================
     * VALIDACIÓN P2P
     * ========================================================
     */

    var tieneVersion =
        parametros.has("v");

    var tieneSesion =
        parametros.has("s");

    var tieneClave =
        parametros.has("k");


    var invitacionValida =
        tieneVersion
        && tieneSesion
        && tieneClave;


    /*
     * ========================================================
     * MÚSICA
     * ========================================================
     */

    var musica = {

        id:
            parametros.get("music_id") || "",

        nombre:
            parametros.get("music_name") || "",

        artista:
            parametros.get("music_artist") || "",

        favorita:
            parametros.get("music_favorite") === "1"

    };


    /*
     * ========================================================
     * LIMPIAR TEXTO
     * ========================================================
     */

    function limpiarTexto(valor){

        if(typeof valor !== "string"){
            return "";
        }

        return valor
            .trim()
            .substring(0, 200);

    }


    musica.id =
        limpiarTexto(musica.id);

    musica.nombre =
        limpiarTexto(musica.nombre);

    musica.artista =
        limpiarTexto(musica.artista);


    /*
     * ========================================================
     * GUARDAR PREFERENCIA MUSICAL
     * ========================================================
     */

    function guardarPreferenciaMusica(){

        if(
            !musica.id
            && !musica.nombre
            && !musica.artista
        ){
            return;
        }

        var datos = {

            id:
                musica.id,

            nombre:
                musica.nombre,

            artista:
                musica.artista,

            favorita:
                musica.favorita,

            fecha:
                Date.now()

        };


        try{

            window.localStorage.setItem(
                "neurojez_music_preference",
                JSON.stringify(datos)
            );

        }catch(error){

            /*
             * LocalStorage puede estar bloqueado.
             * No rompemos la invitación.
             */

        }

    }


    /*
     * ========================================================
     * API MUSICAL
     * ========================================================
     */

    window.NeurojezMusic =
        function(){

            return {

                id:
                    musica.id,

                nombre:
                    musica.nombre,

                artista:
                    musica.artista,

                favorita:
                    musica.favorita

            };

        };


    /*
     * ========================================================
     * CONTROL DE APERTURA
     * ========================================================
     */

    var intentandoAbrir =
        false;

    var paginaOculta =
        false;


    document.addEventListener(
        "visibilitychange",
        function(){

            if(document.hidden){

                paginaOculta = true;

            }

        }
    );


    window.addEventListener(
        "pagehide",
        function(){

            paginaOculta = true;

        }
    );


    window.addEventListener(
        "blur",
        function(){

            /*
             * No declaramos automáticamente que la app
             * está instalada. Solo registramos que el
             * navegador perdió el foco.
             */

            paginaOculta = true;

        }
    );


    /*
     * ========================================================
     * CONSTRUIR ENLACE P2P
     * ========================================================
     */

    function crearEnlaceP2P(){

        /*
         * IMPORTANTE:
         *
         * Conservamos TODOS los parámetros originales.
         *
         * Ejemplo:
         *
         * v
         * m
         * t
         * k
         * c
         * s
         * music_id
         * music_name
         * music_artist
         * music_favorite
         *
         */

        var datos =
            parametros.toString();


        return (
            "chessp2p://join?"
            + datos
        );

    }


    /*
     * ========================================================
     * CREAR INTENT ANDROID
     * ========================================================
     */

    function crearIntentAndroid(){

        var datos =
            parametros.toString();


        /*
         * El esquema sigue siendo chessp2p porque es el
         * esquema que debe tener la versión de neurojez
         * que ya está distribuida.
         */

        return (
            "intent://join?"
            + datos
            + "#Intent;"
            + "scheme=chessp2p;"
            + "end"
        );

    }


    /*
     * ========================================================
     * ABRIR NEUROJEZ
     * ========================================================
     */

    function abrirNeurojez(){

        if(intentandoAbrir){

            return;

        }


        intentandoAbrir =
            true;

        paginaOculta =
            false;


        estado.textContent =
            "Abriendo neurojez…";


        abrir.disabled =
            true;


        /*
         * ----------------------------------------------------
         * ENLACE NORMAL
         * ----------------------------------------------------
         */

        var enlaceNormal =
            crearEnlaceP2P();


        /*
         * ----------------------------------------------------
         * INTENT ANDROID
         * ----------------------------------------------------
         *
         * Primero usamos el intent de Android.
         *
         */

        var enlaceIntent =
            crearIntentAndroid();


        /*
         * En Android/Chrome normalmente el intent://
         * permite entregar la navegación a la aplicación
         * registrada para chessp2p.
         */

        window.location.href =
            enlaceIntent;


        /*
         * ----------------------------------------------------
         * FALLBACK
         * ----------------------------------------------------
         *
         * NO mostramos inmediatamente que la app
         * no está instalada.
         *
         * Damos tiempo a Android.
         *
         */

        window.setTimeout(
            function(){

                /*
                 * Si la página perdió visibilidad,
                 * probablemente Android cambió a la app.
                 */

                if(paginaOculta){

                    return;

                }


                /*
                 * Segundo intento usando el URI normal.
                 *
                 * Esto ayuda con navegadores que no
                 * procesan intent:// de la misma manera.
                 */

                estado.textContent =
                    "Intentando abrir neurojez…";


                window.location.href =
                    enlaceNormal;


                /*
                 * Último fallback.
                 */

                window.setTimeout(
                    function(){

                        if(paginaOculta){

                            return;

                        }


                        estado.textContent =
                            "No se pudo abrir neurojez. Comprueba que la aplicación esté instalada.";

                        abrir.disabled =
                            false;

                        intentarAbrir =
                            false;

                        descargar.style.display =
                            "block";

                    },
                    2500
                );

            },
            1500
        );

    }


    /*
     * ========================================================
     * INVITACIÓN VÁLIDA
     * ========================================================
     */

    if(invitacionValida){

        guardarPreferenciaMusica();


        estado.textContent =
            "Esta invitación contiene una partida P2P.";


        abrir.style.display =
            "block";


        abrir.addEventListener(
            "click",
            abrirNeurojez
        );


        return;

    }


    /*
     * ========================================================
     * INVITACIÓN INVÁLIDA
     * ========================================================
     */

    estado.textContent =
        "La invitación no es válida o está incompleta.";


})();

</script>

</body>
</html>
