<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neurojez — Invitación P2P</title>
<style>
body{font-family:system-ui,sans-serif;max-width:620px;margin:0 auto;padding:40px 20px;text-align:center;background:#111;color:#fff}
.box{background:#1d1d1d;border-radius:20px;padding:25px}
button,a{display:block;width:100%;box-sizing:border-box;padding:16px;margin:14px 0;border-radius:14px;font-size:17px;text-decoration:none}
button{border:0;cursor:pointer;background:#fff;color:#000}
a{border:1px solid #555;color:#fff}
#descargar{display:none}
#estado{line-height:1.5;word-break:break-word}
</style>
</head>
<body>
<div class="box">
<h1>♟️ Neurojez</h1>
<h2>Invitación a partida</h2>
<p id="estado">Preparando la invitación…</p>
<button id="abrir" style="display:none">Abrir Neurojez</button>
<a id="descargar" href="https://github.com/axiol2065/Neurojez-" rel="noopener">Descargar Neurojez</a>
</div>
<script>
const parametros = new URLSearchParams(window.location.search);
const estado = document.getElementById("estado");
const abrir = document.getElementById("abrir");
const descargar = document.getElementById("descargar");

function esInvitacionValida(){
    return parametros.has("v") && parametros.has("s") && parametros.has("k");
}

if(esInvitacionValida()){
    estado.textContent = "Esta invitación contiene una partida P2P.";
    abrir.style.display = "block";
    abrir.onclick = function(){
        estado.textContent = "Intentando abrir Neurojez…";
        const datos = parametros.toString();
        const enlaceNeurojez = "chessp2p://join?" + datos;
        window.location.href = enlaceNeurojez;
        setTimeout(function(){
            estado.textContent = "Neurojez no parece estar instalada en este dispositivo.";
            descargar.style.display = "block";
        },1800);
    };
}else{
    estado.textContent = "La invitación no es válida o está incompleta.";
}
</script>
</body>
</html>
